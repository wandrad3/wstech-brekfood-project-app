# ======================================================
# BrekFood - SonarCloud Configuration
# Used by sonar-maven-plugin AND local sonar-scanner.
# ======================================================
# Project identification (override via CI vars)
# sonar.projectKey=<set via SONAR_PROJECT_KEY in CI>
# sonar.organization=<set via SONAR_ORGANIZATION in CI>
sonar.projectName=BrekFood App
sonar.projectVersion=0.0.1-SNAPSHOT
# Source & binary locations
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
# Coverage
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
# Encoding
sonar.sourceEncoding=UTF-8
# Exclusions (same as JaCoCo)
sonar.exclusions=\
  **/BrekFoodApplication.java,\
  **/shared/infrastructure/config/OpenApiConfig.java,\
  **/shared/infrastructure/config/WebConfig.java,\
  **/shared/interfaces/rest/exception/GlobalExceptionHandler.java
# Coverage exclusions (skeleton packages + infrastructure/config classes)
sonar.coverage.exclusions=\
  **/BrekFoodApplication.java,\
  **/shared/infrastructure/config/OpenApiConfig.java,\
  **/shared/infrastructure/config/WebConfig.java,\
  **/shared/interfaces/rest/exception/GlobalExceptionHandler.java,\
  **/customer/**,\
  **/delivery/**,\
  **/earnings/**,\
  **/order/**,\
  **/payment/**,\
  **/pricing/**,\
  **/restaurant/**
# Quality Gate
sonar.qualitygate.wait=true