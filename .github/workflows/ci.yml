# ======================================================
# BrekFood — CI Pipeline
# Triggers: push to feature/*, hotfix/*, bugfix/*
#           pull_request to develop, main
# Jobs:
#   1. build      — compile + unit tests + JaCoCo coverage gate
#   2. sonar      — SonarCloud analysis (coverage + vulnerabilities)
#   3. create-pr  — auto-create PR to develop (on feature branch push)
# ======================================================

name: CI — Build, Test, Sonar & PR

on:
  push:
    branches:
      - 'feature/**'
      - 'hotfix/**'
      - 'bugfix/**'
      - 'chore/**'
      - 'refactor/**'
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened]

# Cancel in-progress runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_OPTS: '-Xmx1024m'

# ──────────────────────────────────────────────────────
# JOBS
# ──────────────────────────────────────────────────────

jobs:

  # ──────────────── 1. BUILD & TEST ────────────────
  build:
    name: "Build & Test"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "☁️ Checkout source"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarCloud blame

      - name: "☕ Setup JDK ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: "📦 Cache Maven packages"
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: "🔧 Make Maven wrapper executable"
        run: chmod +x ./mvnw

      - name: "🔨 Build & Test (verify + JaCoCo gate)"
        run: ./mvnw clean verify -Dspring.profiles.active=test -B -q

      - name: "📊 Upload JaCoCo report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: "📋 Upload Surefire report"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # ──────────────── 2. SONAR ANALYSIS ──────────────
  sonar:
    name: "SonarCloud Analysis"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    # SonarCloud only on internal branches (not from forks)
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: "☁️ Checkout source"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "☕ Setup JDK ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: "📦 Cache SonarCloud packages"
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: "🔧 Make Maven wrapper executable"
        run: chmod +x ./mvnw

      - name: "🔨 Build with JaCoCo (skip tests, reuse classes)"
        run: ./mvnw clean verify -Dspring.profiles.active=test -B -q

      - name: "🔍 SonarCloud Scan"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -B -q

  # ──────────────── 3. AUTO PR TO DEVELOP ──────────
  create-pr:
    name: "Create PR → develop"
    runs-on: ubuntu-latest
    needs: [build, sonar]
    timeout-minutes: 5
    # Only on push to feature/hotfix/bugfix branches (not PRs)
    if: >
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/heads/feature/') ||
       startsWith(github.ref, 'refs/heads/hotfix/') ||
       startsWith(github.ref, 'refs/heads/bugfix/'))

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: "☁️ Checkout source"
        uses: actions/checkout@v4

      - name: "🔀 Extract branch info"
        id: branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

          # Generate PR title from branch name
          # feature/phase-1.2-auth-service -> Phase 1.2 auth service
          CLEAN_NAME=$(echo "$BRANCH_NAME" | sed 's|^[^/]*/||' | tr '-' ' ' | tr '_' ' ')
          echo "title=${CLEAN_NAME}" >> $GITHUB_OUTPUT

      - name: "📝 Create Pull Request"
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.name }}
          base: develop
          title: "🔀 ${{ steps.branch.outputs.title }}"
          body: |
            ## Auto-generated PR

            **Branch:** `${{ steps.branch.outputs.name }}`
            **Target:** `develop`

            ### ✅ CI Checks Passed
            - [x] Build & unit tests
            - [x] JaCoCo coverage gate (LINE ≥ 70%, BRANCH ≥ 60%, CLASS ≥ 80%)
            - [x] SonarCloud analysis (coverage + vulnerabilities)

            ---
            > _Automatically created by the BrekFood CI pipeline._
          labels: |
            ci/auto-pr
            review-needed
          draft: false
          # Don't create duplicate PRs
          update-existing: true

