# Test profile ? uses H2 in-memory database to avoid requiring a real PostgreSQL instance
spring.datasource.url=jdbc:h2:mem:brekfood_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway in tests (DDL managed by Hibernate directly)
spring.flyway.enabled=false

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.br.wstech.brekfood=DEBUG

