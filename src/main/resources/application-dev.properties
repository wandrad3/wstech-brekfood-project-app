# ======================================================
# BrekFood ? Development Profile
# Active via: -Dspring.profiles.active=dev
# ======================================================

# --- DATASOURCE (local PostgreSQL via docker-compose) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/brekfood
spring.datasource.username=brekfood
spring.datasource.password=brekfood

# --- JPA (dev: show SQL) ---
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# --- FLYWAY (dev: allow repair) ---
spring.flyway.repair-on-migrate=true

# --- SPRINGDOC (dev: Swagger enabled, actuator visible) ---
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=true

# --- JWT (dev: long-lived token for convenience) ---
brekfood.security.jwt.secret=brekfood-dev-secret-key-for-local-development-only-not-for-production
brekfood.security.jwt.expiration-ms=604800000

# --- CORS (dev: allow frontend dev server) ---
brekfood.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200

# --- LOGGING (dev: verbose) ---
logging.level.root=INFO
logging.level.com.br.wstech.brekfood=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.flywaydb=DEBUG

