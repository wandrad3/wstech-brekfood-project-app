spring.application.name=brekfood

# --- DATASOURCE (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:brekfood}
spring.datasource.username=${DB_USER:brekfood}
spring.datasource.password=${DB_PASSWORD:brekfood}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- CONNECTION POOL (HikariCP) ---
spring.datasource.hikari.pool-name=BrekFoodPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- FLYWAY ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# --- SPRINGDOC / OPENAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false

# --- JWT ---
brekfood.security.jwt.secret=${JWT_SECRET:brekfood-default-dev-secret-change-in-production-min-256-bits}
brekfood.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
brekfood.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- LOGGING (base) ---
logging.level.root=WARN
logging.level.com.br.wstech.brekfood=INFO

spring.profiles.active=dev

