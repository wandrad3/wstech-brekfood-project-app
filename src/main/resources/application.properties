spring.application.name=brekfood

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- FLYWAY ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# --- SPRINGDOC / OPENAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false

# --- JWT ---
brekfood.security.jwt.secret=${JWT_SECRET:brekfood-default-dev-secret-change-in-production-min-256-bits}
brekfood.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
brekfood.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
